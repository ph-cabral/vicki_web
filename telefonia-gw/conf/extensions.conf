[general]
static=yes
writeprotect=yes

; Navegador -> Issabel. Sale autenticado como la propia extensión, así que
; Issabel aplica sus rutas, permisos y caller ID como a cualquier interno.
[desde-web]
exten => _[0-9*#+].,1,NoOp(Vicki ${CHANNEL(endpoint)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@issabel-${CHANNEL(endpoint)},,T)
 same => n,Hangup()

; Issabel -> navegador (la central marca a la extensión registrada acá).
[desde-issabel]
exten => _[0-9*#+].,1,NoOp(Issabel -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},,t)
 same => n,Hangup()
