; Puente WebRTC <-> Issabel. Las extensiones se generan en pjsip_usuarios.conf
; (entrypoint.sh, desde usuarios.txt).

[global]
type=global
user_agent=Vicki Telefonia
endpoint_identifier_order=ip,username,anonymous

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5070

; Todo lo que llega desde Issabel (llamadas entrantes a las extensiones).
[issabel-entrante]
type=endpoint
transport=transport-udp
context=desde-issabel
disallow=all
allow=ulaw,alaw
direct_media=no
dtmf_mode=rfc4733
rtp_symmetric=yes

; (el [issabel-entrante] type=identify con la IP de Issabel se genera en pjsip_usuarios.conf)

; Plantilla: navegador. webrtc=yes = avpf + ICE + DTLS-SRTP (cert autogenerado) + rtcp-mux.
[webrtc-usuario](!)
type=endpoint
transport=transport-ws
webrtc=yes
context=desde-web
disallow=all
allow=ulaw,alaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; Plantilla: salida hacia Issabel autenticando como la extensión.
[hacia-issabel](!)
type=endpoint
transport=transport-udp
context=desde-issabel
disallow=all
allow=ulaw,alaw
direct_media=no
dtmf_mode=rfc4733
rtp_symmetric=yes

#include pjsip_usuarios.conf
