services:
  mangueras-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: mangueras_ever
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}   # firma la cookie de sesión (lib/auth/session.ts) — OBLIGATORIO en prod
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NODE_ENV: production
      INDICADORES_API_URL: http://indicadores-api:8001
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      SORTEO_FOTOS_DIR: /app/img_sorteo
    volumes:
      - ./employees:/app/employees:ro
      - ./img_sorteo:/app/img_sorteo:ro
      # adjuntos de rrhh/puestos (documentos/procedimientos) — sin esto se
      # escriben dentro del contenedor y se pierden en cada rebuild, y con
      # USER node (no root) probablemente ni siquiera se pueden crear.
      - ./documentos:/app/documentos
    ports:
      - "3001:3000"
    networks:
      - ai-net
      
  indicadores-api:
    build: ./indicadores-api
    container_name: indicadores_api
    env_file:
      - ./indicadores-api/.env
    # DNS de Active Directory (DC) para resolver SRV-SQL.everwear.local y el KDC.
    # Sin esto el contenedor cae al DNS público y no resuelve nombres internos.
    dns:
      - 10.10.0.232
      - 10.10.0.254
    dns_search:
      - everwear.local
    environment:
      # db.py lee KRB5_CCNAME (con guion bajo) y de ahi setea KRB5CCNAME.
      KRB5_CCNAME: /opt/krb5cc/cc
    volumes:
      # Montar el DIRECTORIO del ccache (no el archivo): cuando kinit/-R reescribe
      # /opt/krb5cc/cc el container ve el ticket renovado sin reiniciar (sin inode stale).
      - /opt/krb5cc:/opt/krb5cc:ro
    restart: unless-stopped
    networks:
      - ai-net
  # Puente WebRTC <-> Issabel para /sorteo/telefono (ver TELEFONIA.md).
  # network_mode host: el audio (RTP/ICE) tiene que salir con la IP real del
  # server; detrás del NAT de Docker los navegadores no reciben audio.
  # Puertos en el host: 8088/tcp (WebSocket), 5070/udp (SIP a Issabel),
  # 20000-20999/udp (audio).
  telefonia-gw:
    build: ./telefonia-gw
    container_name: vicki_telefonia
    network_mode: host
    restart: unless-stopped
    environment:
      ISSABEL_HOST: ${ISSABEL_HOST:-10.10.0.248}
      ISSABEL_PORT: ${ISSABEL_PORT:-5060}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      # usuarios.txt: "<extension> <secret>" por línea (no está en git)
      - ./telefonia-gw/datos:/etc/vicki-gw:ro

networks:
  ai-net:
    external: true
